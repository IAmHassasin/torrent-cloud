# Base aria2 configuration for the Torrent Cloud worker.
# Secrets and per-deployment values are appended by entrypoint.sh at start-up.

dir=/downloads
continue=true
max-concurrent-downloads=5
file-allocation=none
disk-cache=64M
auto-file-renaming=true
allow-overwrite=false

# JSON-RPC (reachable only on the internal Docker network)
enable-rpc=true
rpc-listen-all=true
rpc-listen-port=6800
rpc-allow-origin-all=false
rpc-max-request-size=16M

# BitTorrent
listen-port=51413
dht-listen-port=51413
enable-dht=true
enable-dht6=false
enable-peer-exchange=true
bt-enable-lpd=false
bt-max-peers=128
bt-request-peer-speed-limit=10M
follow-torrent=true
bt-save-metadata=false
bt-remove-unselected-file=true
bt-detach-seed-only=true
bt-tracker-connect-timeout=10
bt-tracker-timeout=10
seed-ratio=0.0

# Logging
console-log-level=warn
summary-interval=0
