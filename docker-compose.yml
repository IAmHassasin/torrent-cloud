name: torrent-cloud

services:
  aria2:
    build: ./aria2
    restart: unless-stopped
    environment:
      ARIA2_RPC_SECRET: ${ARIA2_RPC_SECRET:?run npm run gen-env first}
      SEED_TIME_MIN: ${SEED_TIME_MIN:-0}
      ARIA2_BT_TRACKERS: ${ARIA2_BT_TRACKERS:-}
    volumes:
      - downloads:/downloads
    # aria2 contacts hosts named in user-supplied torrents (trackers, web seeds), so it lives on
    # its own network and cannot reach the storage service.
    networks: [engine]
    # Incoming BitTorrent connections improve speed on a real server. Publish them only after
    # reviewing the host firewall:
    # ports:
    #   - "51413:51413"
    #   - "51413:51413/udp"

  storage:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/tc/entrypoint.sh"]
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?run npm run gen-env first}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?run npm run gen-env first}
    volumes:
      - ./storage/entrypoint.sh:/opt/tc/entrypoint.sh:ro
      - storage-data:/data
    networks: [store]
    ports:
      # Download links point here; bound to localhost only.
      - "127.0.0.1:8333:8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || wget -q -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      aria2:
        condition: service_started
      storage:
        condition: service_healthy
    env_file: .env
    environment:
      ARIA2_RPC_URL: http://aria2:6800/jsonrpc
      DOWNLOAD_DIR: /downloads
      DATA_DIR: /data
      PORT: "8080"
    volumes:
      - downloads:/downloads
      - api-data:/data
    networks: [engine, store]
    ports:
      - "127.0.0.1:8080:8080"

networks:
  engine:
  store:

volumes:
  downloads:
  storage-data:
  api-data:
